{% extends 'base.html' %}

{% block content %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<title>Level Spotter</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-wodth, initial-scale=1.0">
	<link type="text/css" href="{% static 'spotter/css/style_1.css' %}" rel="stylesheet">
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

	<li class="open_index">

		<div class="div_number">

			<div class="div-img">
				<img class="img-index" src="{% static 'spotter/images/img-index_1.png' %}">
			</div>

			<h1 class="title-container">Введіть коригувальні значення в мм.</h1>

			<form method="get" action="{% url 'index_2' %}" name="form_correct">

				<ul class="our-form">
					<li>
						<input type="text" class="display_number" name="correct_value" readonly="readonly" placeholder="0">
					</li>

					<li>
						<ul class="cell_back-and-accept">
							<li><button class="btn-back" form="click_back" type="submit">Назад</button></li>
							<li><button class="btn-accept" type="submit">Прийняти</button></li>
						</ul>
					</li>
					<li>
						<table class="table_number">
							<script>
								var maxt=3
							</script>

							<tr>
								<td><input type="button" class="btn_num" value="1" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='1'}"></td>

								<td><input type="button" class="btn_num" value="2" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='2'}"></td>

								<td><input type="button" class="btn_num" value="3" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='3'}"></td>
							</tr>
							<tr>
								<td><input type="button" class="btn_num" value="4" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='4'}"></td>

								<td><input type="button" class="btn_num" value="5" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='5'}"></td>

								<td><input type="button" class="btn_num" value="6" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='6'}"></td>
							</tr>
							<tr>
								<td><input type="button" class="btn_num" value="7" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='7'}"></td>

								<td><input type="button" class="btn_num" value="8" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='8'}"></td>

								<td><input type="button" class="btn_num" value="9" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='9'}"></td>
							</tr>
							<tr>
								<td><input type="button" class="btn_num" value="-" onclick="if(form_correct.correct_value.value.length == 0){maxt=4; form_correct.correct_value.value+='-';} else if (form_correct.correct_value.value < 0) {maxt=4; form_correct.correct_value.value-=form_correct.correct_value.value * 2} else if (form_correct.correct_value.value > 0) {maxt=4; form_correct.correct_value.value-=form_correct.correct_value.value * 2} "></td>

								<td><input type="button" class="btn_num" value="0" onclick="if (form_correct.correct_value.value > 0) {maxt=3} if (form_correct.correct_value.value.length == 0) {form_correct.correct_value.value+=''} else if (form_correct.correct_value.value.length < maxt) {form_correct.correct_value.value+='0'}"></td>

								<td><input type="button" class="btn_num" value="<" onclick="if (form_correct.correct_value.value.length <= maxt) {form_correct.correct_value.value= form_correct.correct_value.value.slice(0,-1)}"></td>
							</tr>
						</table>
					</li>
				</ul>
			</form>

			<form action="{% url 'spotter' %}" id="click_back"></form>

		</div>

	</li>

</html>

{% endblock %}
